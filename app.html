function listPage(p){return bar('<b style="flex:1;text-align:center">'+esc(p.title)+'</b>')+grid(p.ids)}
function rows(ids){return ids.map(function(id){var x=T_(id);return x?'<button class="row" data-a="open:'+id+'">'+poster(x,"ico")+'<span class="grow"><b>'+esc(nm(x))+'</b><small>'+esc(when(x))+'</small></span></button>':""}).join("")}
function resultsPage(p){var k=p.tab,ids=(k==="movie"?p.movies:p.series);
  return bar('<b style="flex:1;text-align:center">'+esc(p.q)+'</b>')+'<div class="pad"><div class="tabs"><button class="'+(k==="movie"?"on":"")+'" data-a="rt:movie">'+t("movies")+' · '+p.movies.length+'</button><button class="'+(k==="series"?"on":"")+'" data-a="rt:series">'+t("series")+' · '+p.series.length+'</button></div></div>'+(ids.length?rows(ids):'<div class="center mute">'+t("noRes")+'</div>')}
function titlePage(id){
  var x=D[id],b=T_(id)||{};
  if(!x)return bar()+'<div class="center mute">…</div>';
  var r=stat(id),gs=genresOf(id),pv=x.prov||[],desc;
  if(S.full&&x.description_full)desc='<button class="sqb" data-a="short">'+ic(I.back,14)+'</button>'+esc(x.description_full);
  else desc=esc(x.description_short)+(x.description_full?' <button class="sqb" data-a="full">…</button>':"");
  var chips=[when(x),x.runtime_min?dur(x.runtime_min):"",x.kind==="series"&&!x.coming_soon&&x.series_status?t("st_"+x.series_status):""].filter(Boolean).map(function(c){return'<span class="chip">'+esc(c)+'</span>'}).join("")+
    gs.map(function(g){return'<button class="chip" data-a="gen:'+g.id+'">'+esc(g.emoji)+" "+esc(g.name)+'</button>'}).join("");
  var pl=[["will_watch","will"]].concat(x.kind==="series"?[["watching","watching"]]:[]).concat([["watched","watched"]]);
  var sim=(x.sim||[]).filter(function(i){return T_(i)});
  return bar(x.trailer_url?'<button class="ib" data-a="trailer" aria-label="Trailer">'+ic(I.play)+'</button>':null,'<button class="ib" data-a="share" aria-label="Share">'+ic(I.share)+'</button>')+
  '<div class="head">'+poster(x)+'<div><h1>'+esc(nm(x))+'</h1><button data-a="rsheet" class="chip" style="display:inline-flex;gap:6px;margin-top:4px">★ '+(r||"—")+' '+ic(I.chev,12)+'</button></div></div>'+
  '<div class="chips">'+chips+'</div><div class="desc">'+desc+'</div>'+
  '<div class="pills">'+pl.map(function(s){return'<button class="pill'+(MY[id]===s[0]?" on":"")+'" data-a="st:'+s[0]+'">'+t(s[1])+'</button>'}).join("")+'</div>'+
  '<div style="margin-top:8px">'+(x.has_watch&&pv.length?'<button class="row" data-a="onl"><span class="rb">'+ic(I.play)+'</span><span class="grow">'+t("online")+'</span><span class="stack">'+pv.slice(0,3).map(function(q){return q.providers&&q.providers.icon_url?'<img src="'+esc(q.providers.icon_url)+'" alt="">':'<i></i>'}).join("")+'</span>'+ic(I.chev,18)+'</button>':"")+
  '<button class="row" data-a="share"><span class="rb">'+ic(I.share)+'</span><span class="grow">'+t("send")+'</span>'+ic(I.chev,18)+'</button></div>'+
  (sim.length?'<h2>'+t("similar")+'</h2><div class="hs">'+sim.map(function(i){var q=T_(i);return'<button class="pc" data-a="open:'+i+'">'+poster(q)+'<b>'+esc(nm(q))+'</b></button>'}).join("")+'</div>':"")}
function sheet(){
  var s=S.sheet;if(!s)return"";var x=D[s.id]||{},h="";
  if(s.n==="onl")h=(x.prov||[]).map(function(q){var p=q.providers||{};return'<button class="row" data-a="prov:'+q.provider_id+'">'+(p.icon_url?'<img class="ico" src="'+esc(p.icon_url)+'" alt="">':'<span class="ico"></span>')+'<span class="grow">'+esc(p.name)+(q.note?'<small>'+esc(q.note)+'</small>':"")+'</span></button>'}).join("");
  else{var st=DB.stats[s.id],lk=function(n,v,u){return v?'<button class="row" data-a="'+(u?"lnk:"+u:"x")+'"><span class="grow">'+n+'</span><b>'+v+'</b></button>':""};
    h=lk(t("users"),st&&st.ratings_count>0?"★ "+Number(st.avg_score).toFixed(1)+" · "+st.ratings_count+" "+t("rate"):"—","")+lk("IMDb",x.rating_imdb,"imdb")+lk("Rotten Tomatoes",x.rating_rt!=null?x.rating_rt+"%":"","rt")+lk("КиноПоиск",x.rating_kp,"kp")}
  return'<div class="sheetbg" data-a="sclose"><div class="sheet" data-a="x">'+h+'</div></div>'}
function profilePage(){
  var u=tg&&tg.initDataUnsafe&&tg.initDataUnsafe.user||{},name=[ME.first_name||u.first_name,ME.last_name||u.last_name].filter(Boolean).join(" ")||"Want Watch",L=DB.links;
  function R(ico,a,tt,ss,cls){return'<button class="row '+(cls||"")+'" data-a="'+a+'"><span class="rb">'+ic(ico)+'</span><span class="grow">'+tt+(ss?'<small>'+ss+'</small>':"")+'</span>'+ic(I.chev,18)+'</button>'}
  var photo=ME.photo_url||u.photo_url;
  return'<div class="top"><span class="ib ph"></span><div class="logo">'+t("profile").toUpperCase()+'</div><button class="ib" data-a="theme">'+ic(document.documentElement.dataset.theme==="dark"?I.sun:I.moon)+'</button></div>'+
  '<div class="center" style="padding:6px 0 18px">'+(photo?'<img class="av" src="'+esc(photo)+'" alt="">':'<div class="av">'+esc(name.charAt(0))+'</div>')+'<h1>'+esc(name)+'</h1><div class="mute">'+(ME.username||u.username?"@"+esc(ME.username||u.username):"")+'</div></div>'+
  (tg&&tg.addToHomeScreen?'<div class="grp">'+R(I.plus,"addhome",t("home"),t("homeS"))+'</div>':"")+
  '<div class="cap">'+t("links")+'</div><div class="grp">'+(L.support?R(I.chat,"lnk:support",t("feedback"),t("feedbackS")):"")+(L.suggest?R(I.plus,"lnk:suggest",t("suggest"),t("suggestS")):"")+(L.donate?R(I.heart,"lnk:donate",t("donate"),t("donateS")):"")+(L.ads_bot?R(I.mega,"lnk:ads_bot",t("ads"),t("adsS")):"")+(L.channel?R(I.send,"lnk:channel",t("chan"),t("chanS")):"")+'</div>'+
  '<div class="cap">'+t("settings")+'</div><div class="grp">'+R(I.globe,"lang",t("lang"),LANG==="ru"?"Русский":"English")+R(I.sun,"theme",t("theme"),document.documentElement.dataset.theme==="dark"?t("dark"):t("light"))+'</div>'+
  '<div class="cap">'+t("account")+'</div><div class="grp">'+R(I.trash,"del",t("del"),t("delS"),"red")+'</div>'}
function searchOv(){return'<div class="ov"><div class="sbar"><input id="q" value="'+esc(S.sq)+'" placeholder="'+t("ph")+'" autocomplete="off" autocapitalize="off" enterkeyhint="search"><button class="ib" data-a="sgo" aria-label="Go">'+ic(I.arrow)+'</button><button class="ib" data-a="sx" aria-label="Close">'+ic(I.x)+'</button></div><div id="sres" style="margin:10px -16px">'+sresHtml()+'</div></div>'}
function sresHtml(){return S.sres.length?S.sres.map(function(r){return'<button class="row" data-a="open:'+r.id+'">'+poster(r,"ico")+'<span class="grow"><b>'+esc(nm(r))+'</b><small>'+(r.kind==="movie"?t("movies"):t("series"))+" · "+esc(when(r))+'</small></span></button>'}).join(""):""}
function nav(){var T3=[["movies",I.film],["series",I.tv],["profile",I.user]];
  return'<div class="nav"><div class="pillnav">'+T3.map(function(x){return'<button class="nb'+(S.tab===x[0]&&!S.stack.length?" on":"")+'" data-a="tab:'+x[0]+'" aria-label="'+t(x[0])+'">'+ic(x[1],24)+'</button>'}).join("")+'</div><button class="sbub" data-a="so" aria-label="'+t("search")+'">'+ic(I.search,24)+'</button></div>'}
function render(){
  var p=page(),h;
  if(p.n==="movies")h=homePage("movie");else if(p.n==="series")h=homePage("series");else if(p.n==="profile")h=profilePage();
  else if(p.n==="title")h=titlePage(p.id);else if(p.n==="list")h=listPage(p);else h=resultsPage(p);
  app.innerHTML=h+nav()+sheet()+(S.search?searchOv():"");
  if(tg&&tg.BackButton){try{(S.stack.length||S.search||S.sheet)?tg.BackButton.show():tg.BackButton.hide()}catch(e){}}
  var sl=document.getElementById("sl");if(sl){sl.onscroll=function(){var f=sl.firstChild,w=f.offsetWidth+10,i=Math.round(sl.scrollLeft/w),d=document.querySelectorAll(".dots i");d.forEach(function(e,j){e.className=j===i?"on":""})}}
  if(S.search){var q=document.getElementById("q");if(q&&!S.focused){q.focus();S.focused=1}}
}

/* ---------- поиск ---------- */
var stm=null;
app.addEventListener("input",function(e){if(e.target.id!=="q")return;S.sq=e.target.value;clearTimeout(stm);stm=setTimeout(async function(){var v=S.sq.trim();if(!v){S.sres=[];document.getElementById("sres").innerHTML="";return}
  var r=await sb.rpc("search_titles",{p_query:v,p_limit:8});S.sres=r.data||[];var b=document.getElementById("sres");if(b&&S.sq.trim()===v)b.innerHTML=sresHtml()},180)});
app.addEventListener("keydown",function(e){if(e.target.id==="q"&&e.key==="Enter")goSearch()});
async function goSearch(){
  var v=S.sq.trim();if(!v)return;
  var c=v.toUpperCase().replace(/[АВЕКМНОРСТХ]/g,function(ch){return"ABEKMHOPCTX"["АВЕКМНОРСТХ".indexOf(ch)]});
  if(/^[A-Z]\d{4,}$/.test(c)){var x=DB.titles.find(function(q){return q.code===c});if(!x){toast(t("noCode"));return}S.search=false;S.focused=0;return openTitle(x.id)}
  var r=await sb.rpc("search_titles",{p_query:v,p_limit:50}),a=r.data||[];
  var mv=a.filter(function(q){return q.kind==="movie"}).map(function(q){return q.id}),sr=a.filter(function(q){return q.kind==="series"}).map(function(q){return q.id});
  S.search=false;S.focused=0;push({n:"results",q:v,movies:mv,series:sr,tab:mv.length||!sr.length?"movie":"series"})}

/* ---------- действия ---------- */
function shareLink(id){return CFG.botApp?"https://t.me/"+CFG.botApp+"?startapp=t"+id:location.origin+location.pathname+"?t="+id}
async function setStatus(id,st){
  try{if(MY[id]===st){var d=await sb.from("user_titles").delete().eq("user_id",UID).eq("title_id",id);if(d.error)throw d.error;delete MY[id]}
  else{var u=await sb.from("user_titles").upsert({user_id:UID,title_id:id,status:st},{onConflict:"user_id,title_id"});if(u.error)throw u.error;MY[id]=st}
  hap();render()}catch(e){toast("Не удалось сохранить / Could not save")}}
function ext(u){if(!u)return;try{if(tg&&/t\.me\//.test(u)&&tg.openTelegramLink)tg.openTelegramLink(u);else if(tg&&tg.openLink)tg.openLink(u);else window.open(u,"_blank","noopener")}catch(e){window.open(u,"_blank","noopener")}}
app.addEventListener("click",async function(e){
  var b=e.target.closest("[data-a]");if(!b)return;var a=b.dataset.a,p=a.split(":"),pg=page();
  switch(p[0]){
    case"x":return;
    case"tab":return tab(p[1]);
    case"back":return pop();
    case"open":S.search=false;S.focused=0;return openTitle(Number(p[1]));
    case"chan":return ext(DB.links.channel);
    case"theme":setTheme(document.documentElement.dataset.theme==="dark"?"light":"dark");return render();
    case"lang":LANG=LANG==="ru"?"en":"ru";lss("ww_lang",LANG);return render();
    case"col":var c=DB.cols.find(function(x){return x.id===Number(p[1])});return push({n:"list",title:c.title,ids:colIds(c)});
    case"rnd":var k=DB.titles.filter(function(x){return x.kind===p[1]});if(!k.length)return toast(t("empty"));return openTitle(k[Math.floor(Math.random()*k.length)].id);
    case"gen":var g=DB.genres.find(function(x){return x.id===Number(p[1])});return push({n:"list",title:g.emoji+" "+g.name,ids:DB.tg.filter(function(q){return q.genre_id===g.id}).map(function(q){return q.title_id}).filter(function(i){return T_(i)})});
    case"full":S.full=true;return render();case"short":S.full=false;return render();
    case"st":return setStatus(pg.id,p[1]);
    case"trailer":return ext(D[pg.id].trailer_url);
    case"share":var nmx=nm(D[pg.id]);return ext("https://t.me/share/url?url="+encodeURIComponent(shareLink(pg.id))+"&text="+encodeURIComponent(nmx));
    case"onl":S.sheet={n:"onl",id:pg.id};track("open_providers",{title_id:pg.id});return render();
    case"rsheet":S.sheet={n:"rat",id:pg.id};return render();
    case"sclose":S.sheet=null;return render();
    case"prov":track("click_provider",{title_id:pg.id,provider_id:Number(p[1])});var q=(D[pg.id].prov||[]).find(function(z){return z.provider_id===Number(p[1])});return ext(q&&q.url);
    case"lnk":var u=DB.links[p[1]]||(D[pg.id]&&D[pg.id][p[1]+"_url"]);return ext(u);
    case"rt":pg.tab=p[1];return render();
    case"so":S.search=true;S.focused=0;return render();
    case"sx":S.search=false;S.focused=0;return render();
    case"sgo":return goSearch();
    case"addhome":try{tg.addToHomeScreen()}catch(err){}return;
    case"del":if(!confirm(t("delQ")))return;var r=await sb.rpc("delete_my_account");if(r.error)return toast("Error");await sb.auth.signOut();if(tg&&tg.close)tg.close();return;
  }});

/* ---------- старт и вход ---------- */
function fail(code){app.innerHTML='<div class="center"><h1>'+t("fail")+'</h1><p class="mute">'+(code==="banned"?t("banned"):code==="no_tg"?t("openTg"):"")+'</p><p class="mute sm">'+esc(code)+'</p>'+(code==="banned"?"":'<button class="pill on" style="padding:14px 28px" onclick="boot()">'+t("retry")+'</button>')+'</div>'}
async function boot(){
  app.innerHTML='<div class="center mute">…</div>';
  try{
    if(tg&&tg.initData){
      var r=await fetch(SB_URL+"/functions/v1/telegram-auth",{method:"POST",headers:{"Content-Type":"application/json",apikey:SB_KEY},body:JSON.stringify({initData:tg.initData})}),j=await r.json().catch(function(){return{}});
      if(!r.ok)return fail(j.error||"http_"+r.status);
      var ss=await sb.auth.setSession({access_token:j.access_token,refresh_token:j.refresh_token});if(ss.error)return fail("session");
    }
    var s=await sb.auth.getSession();if(!s.data.session)return fail("no_tg");
    UID=s.data.session.user.id;await load();
    var sp=(tg&&tg.initDataUnsafe&&tg.initDataUnsafe.start_param)||"",qp=new URLSearchParams(location.search).get("t"),tid=/^t(\d+)$/.exec(sp);tid=tid?Number(tid[1]):(qp?Number(qp):null);
    render();if(tid&&T_(tid))openTitle(tid);
  }catch(err){console.error(err);fail(String(err&&err.message||err).slice(0,80))}
}
boot();
</script>
