@keyframes ccin{from{transform:scale(.8);opacity:0}to{transform:none;opacity:1}}
#achc .aic{animation:spinin .8s ease}@keyframes spinin{from{transform:rotate(-200deg) scale(.4)}to{transform:none}}
#achc small{color:#d99a00;font-weight:800;letter-spacing:.06em;text-transform:uppercase;font-size:12px;margin-top:6px}#achc b{font-size:21px}#achc p{margin:0 0 10px;color:var(--mute);font-size:14.5px;line-height:1.45}
#achc button{width:100%;padding:15px;border-radius:999px;background:var(--ink);color:var(--bg);font-weight:700;font-size:15px}
.epbox{margin-top:0}.epsh small{display:block;color:var(--mute);font-size:13px;margin-top:2px}.epc{font-size:13px;color:var(--mute);font-weight:600;font-variant-numeric:tabular-nums}
.epbar,.pbar{display:block;height:4px;border-radius:2px;background:var(--s2);overflow:hidden;margin:-6px 16px 10px 70px}.epbar span,.pbar span{display:block;height:100%;background:var(--ink);border-radius:2px}
.pbar{margin:4px 0 0}
.epw{margin:2px 16px 10px;padding:12px 12px 14px;border-radius:22px;background:var(--s1);animation:rfin .25s ease}
.epss{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -2px 10px;padding:0 2px}.epss::-webkit-scrollbar{display:none}.epss .chip{flex:none;padding:8px 13px;font-size:13.5px;background:var(--bg)}.epss .chip.on{background:var(--ink);color:var(--bg)}
.epsn{font-size:13px;color:var(--mute);margin:-2px 4px 8px}
.ep{display:flex;align-items:flex-start;gap:10px;padding:4px 2px}.ep+.ep{border-top:1px solid var(--line)}
.epk{flex:none;width:36px;height:36px;display:grid;place-items:center;color:var(--ink)}.epk i{width:22px;height:22px;border-radius:50%;border:1.8px solid var(--mute);opacity:.6}
.ept{flex:1;text-align:left;padding:8px 0;min-width:0}.ept b{font-weight:600;font-size:14.5px;display:block}.ep.on .ept b{color:var(--mute)}
.ept small{display:block;color:var(--mute);font-size:13px;line-height:1.45;margin-top:4px;font-weight:400}
.epall{width:100%;margin-top:8px;padding:12px;border-radius:14px;background:var(--bg);font-weight:600;font-size:14px}
.epdone{margin-top:10px;padding:14px;border-radius:16px;background:var(--bg);text-align:center}.epdone b{display:block;margin-bottom:10px}.epdone button{width:100%;padding:13px;border-radius:999px;background:var(--ink);color:var(--bg);font-weight:700}
.ntb{display:flex;gap:10px;align-items:flex-start;margin:0 16px 14px;width:calc(100% - 32px);padding:12px 14px;border-radius:16px;font-size:14px;line-height:1.4;font-weight:600;text-align:left}
.ntb svg{flex:none;margin-top:-1px}.ntb span{white-space:pre-line}
.nt-red{background:#fde8e7;color:#b42318}.nt-yellow{background:#fff3cf;color:#8a5a00}.nt-blue{background:#e5f0ff;color:#1d5bd8}
[data-theme=dark] .nt-red{background:rgba(240,68,56,.16);color:#ff8a80}[data-theme=dark] .nt-yellow{background:rgba(245,180,0,.15);color:#ffd166}[data-theme=dark] .nt-blue{background:rgba(64,140,255,.16);color:#8cb8ff}
#onb{position:fixed;inset:0;z-index:280;background:var(--bg);display:flex;flex-direction:column;padding-top:var(--tgt,0px);transition:opacity .3s;animation:pin .3s}#onb.off{opacity:0}
.otr{flex:1;display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;overscroll-behavior:contain}.otr::-webkit-scrollbar{display:none}
.osl{flex:0 0 100%;scroll-snap-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:16px 28px;overflow-y:auto}
.osl img{width:min(64vw,270px);height:auto;margin-bottom:22px;user-select:none;-webkit-user-drag:none}
.osl h2{margin:0 0 12px;font-size:25px;line-height:1.2;letter-spacing:-.01em}.osl p{margin:0;color:var(--mute);font-size:16px;line-height:1.5;max-width:420px}
.osl:last-child img{width:min(46vw,190px);margin-bottom:16px}
.obs{width:100%;max-width:380px;margin-top:20px;display:flex;flex-direction:column;gap:8px}
.ob{display:flex;align-items:center;gap:12px;padding:13px 16px;border-radius:14px;color:#fff;font-weight:700;font-size:15px;text-align:left}.ob svg{flex:none}.ob.tg{background:#2aabee}.ob.vk{background:#0077ff}
.osq{display:flex;gap:8px;justify-content:center;margin-top:4px}.os{width:54px;height:54px;border-radius:14px;display:grid;place-items:center}
.os.yt{background:#ff0000}.os.tt{background:#111}[data-theme=dark] .os.tt{background:#2a2a30}.os.ig{background:linear-gradient(45deg,#f9a13a,#e1306c 50%,#833ab4)}
.ofo{padding:10px 20px calc(env(safe-area-inset-bottom,0px) + 18px);display:flex;flex-direction:column;align-items:center;gap:16px}
.odots{display:flex;gap:7px}.odots i{width:7px;height:7px;border-radius:4px;background:var(--s2);transition:all .25s}.odots i.on{width:22px;background:var(--ink)}
.onx{width:100%;max-width:420px;padding:16px;border-radius:999px;background:var(--ink);color:var(--bg);font-weight:700;font-size:16px}
.bell{position:relative}.bdg{position:absolute;top:2px;right:1px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:#ff3b30;color:#fff;font-style:normal;font-size:11px;font-weight:700;display:grid;place-items:center;border:2px solid var(--bg)}
.ntl{padding:0 16px}.nti{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;padding:14px 0;border-top:1px solid var(--line);position:relative}.nti:first-child{border-top:0}
.nic{width:44px;height:44px;border-radius:50%;background:var(--s1);display:grid;place-items:center;flex:none}.nip{width:44px;height:64px;border-radius:8px;object-fit:cover;flex:none}
.nti b{display:block;font-size:15px;margin-bottom:3px}.nti small{display:block;color:var(--mute);font-size:14px;line-height:1.4}.nti em{display:block;font-style:normal;color:var(--mute);font-size:12px;margin-top:5px;opacity:.8}
.ndot{width:9px;height:9px;border-radius:50%;background:#ff3b30;flex:none;margin-top:6px}
.subb{display:flex;align-items:center;justify-content:center;gap:8px;margin:16px 16px 0;width:calc(100% - 32px);padding:14px;border-radius:999px;background:#2a78d6;color:#fff;font-weight:700;font-size:15px}
.subb.on{background:var(--s1);color:var(--ink)}.subb+.pills{padding-top:10px}
.epr{display:flex;gap:2px;flex:none;align-self:center}.epr .vt{width:28px;height:28px;font-size:15px}
.stg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:0 16px 6px}
.stt{background:var(--s1);border-radius:18px;padding:14px 10px;text-align:center}.stt b{display:block;font-size:24px;font-variant-numeric:tabular-nums}.stt span{display:block;color:var(--mute);font-size:12px;margin-top:2px;line-height:1.25}
.stc{margin:12px 16px 0;padding:16px;border-radius:22px;background:var(--s1)}.sth{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:14px}.sth b{font-size:15.5px}.sth span{color:var(--mute);font-size:13px;font-weight:600}
.vb{display:flex;align-items:flex-end;gap:5px;height:130px}.vbc{flex:1;display:flex;flex-direction:column;align-items:center;height:100%;min-width:0}
.vbc em{font-style:normal;font-size:11px;color:var(--mute);height:15px;font-variant-numeric:tabular-nums}.vbc i{flex:1;width:100%;display:flex;align-items:flex-end}.vbc i b{display:block;width:100%;border-radius:4px 4px 0 0;background:var(--ink)}
.vbc span{font-size:11.5px;color:var(--mute);margin-top:6px;white-space:nowrap}
.hb{display:flex;flex-direction:column;gap:10px}.hbr{display:grid;grid-template-columns:minmax(0,40%) 1fr auto;gap:10px;align-items:center;font-size:13.5px}
.hbr span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.hbr i{height:8px;border-radius:4px;background:var(--s2);overflow:hidden}.hbr i b{display:block;height:100%;border-radius:4px;background:var(--ink)}.hbr em{font-style:normal;color:var(--mute);font-variant-numeric:tabular-nums;font-size:13px}
.pills.p2{padding-top:10px}
.nws{padding:0 16px;display:flex;flex-direction:column;gap:14px}
.nwc{background:var(--s1);border-radius:22px;padding:14px;overflow:hidden}
.nwh{display:flex;align-items:center;gap:10px;margin-bottom:12px}.nwh img{width:38px;height:38px;border-radius:50%;background:var(--bg);object-fit:contain;padding:6px}.nwh b{display:block;font-size:14.5px}.nwh small{color:var(--mute);font-size:12.5px}
.nwph{position:relative;margin:0 -14px 12px;background:var(--s2)}.nwph img{display:block;width:100%;max-height:440px;object-fit:cover}
.nwph.many{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;gap:4px;scrollbar-width:none}.nwph.many::-webkit-scrollbar{display:none}.nwph.many img{flex:0 0 88%;scroll-snap-align:center;height:300px}
.nwv{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:58px;height:58px;border-radius:50%;background:rgba(0,0,0,.55);color:#fff;display:grid;place-items:center}.nwv svg{fill:currentColor}
.nwt{font-size:15px;line-height:1.5;overflow-wrap:anywhere}.nwt a{color:#2a78d6;text-decoration:none}[data-theme=dark] .nwt a{color:#6aa8ff}
.nwt code{font-size:13.5px;background:var(--s2);padding:1px 5px;border-radius:5px}.nwt .htg{color:#2a78d6}.nwt .bq{display:block;border-left:3px solid var(--line);padding-left:10px;margin:6px 0;color:var(--mute)}
.nwt .spl{background:var(--ink);color:transparent;border-radius:4px;transition:all .2s}.nwt .spl:active{background:none;color:inherit}
.nwo{display:flex;align-items:center;gap:4px;margin-top:12px;font-size:13.5px;font-weight:600;color:var(--mute)}
.nwc.sk{height:240px;position:relative}.nwc.sk i,.nwc.sk b{display:block;border-radius:10px;background:var(--s2);animation:skp 1.2s ease-in-out infinite alternate}.nwc.sk i{height:140px;margin-bottom:12px}.nwc.sk b{height:14px;margin-bottom:8px;width:80%}
@keyframes skp{from{opacity:.5}to{opacity:1}}
</style>

(function tick(){var f=document.getElementById("lgf");if(!f)return;
  SP.w+=.09;SP.p+=(SP.t-SP.p)*(SP.done?.12:.022)+(SP.done?.4:.04);if(SP.p>SP.t)SP.p=SP.t;
  var L=106-SP.p*1.12,a=SP.p>=99.8?0:2.4,pts=[];
  for(var x=0;x<=100;x+=5)pts.push(x+"% "+(L+a*Math.sin(x*.13+SP.w*4)).toFixed(2)+"%");

function promoDue(P){/* не чаще, чем раз в 5 запусков или 3 дня; правка баннера в админке (P.v) сбрасывает счётчик */
  try{var k="ww_promo",st=JSON.parse(localStorage.getItem(k)||"null"),v=String(P.v||"0");
    if(!st||st.v!==v)return true;
    return st.n>=5||Date.now()-st.at>=3*864e5}catch(e){return true}}

function morph(a,b){
  var ac=a.childNodes,bc=b.childNodes,i,x,y;
  for(i=0;i<bc.length;i++){

    var j,at;
    for(j=0;j<y.attributes.length;j++){at=y.attributes[j];if(x.getAttribute(at.name)!==at.value)x.setAttribute(at.name,at.value)}
    for(j=x.attributes.length-1;j>=0;j--){at=x.attributes[j];if(!y.hasAttribute(at.name))x.removeAttribute(at.name)}
    if(x.nodeName==="INPUT"&&x!==document.activeElement&&x.value!==y.value)x.value=y.value;

    case"stats":hap();return push({n:"stats"});
    case"onb":return showOnb(true);
    case"er":return epReact(Number(p[1]),Number(p[2]));
    case"nl":return ext(b.dataset.u);
    case"nmore":return loadNews(true);
    case"rfclose":S.rf=null;hap();return render();
    case"rcom":return ext((D[pg.id]||{}).comments_url);
    case"unwatch":var uid0=pg.id;return ask(t("unwatchQ"),function(){unwatch(uid0)});
    case"trailer":var tx=D[pg.id]||T_(pg.id)||{};return p[1]==="alt"?askGo(tx.trailer_alt_kind,function(){ext(tx.trailer_alt_url)}):askGo("yt",function(){playTrailer(tx.trailer_url)});
    case"share":track("share",{title_id:pg.id});return shareTitle(pg.id);
    case"onl":S.sheet={n:"onl",id:pg.id};track("open_providers",{title_id:pg.id});return render();
    case"rsheet":S.sheet={n:"rat",id:pg.id};return render();
    case"sclose":S.sheet=null;return render();
    case"prov":track("click_provider",{title_id:pg.id,provider_id:Number(p[1])});var q=(D[pg.id].prov||[]).find(function(z){return z.provider_id===Number(p[1])});return ext(q&&q.url);
    case"lnk":var u=DB.links[p[1]]||(D[pg.id]&&D[pg.id][p[1]+"_url"]);return ext(u);
    case"rt":pg.tab=p[1];return render();
    case"so":S.search=true;S.focused=0;return render();
    case"sx":S.search=false;S.focused=0;return render();
    case"sgo":return goSearch();
    case"addhome":try{tg.addToHomeScreen()}catch(err){}return;
    case"del":if(!confirm(t("delQ")))return;var r=await sb.rpc("delete_my_account");if(r.error)return toast("Error");await sb.auth.signOut();if(tg&&tg.close)tg.close();return;
  }});

/* ---------- старт и вход ---------- */
function fail(code){hideSplash(true);app.innerHTML='<div class="center"><h1>'+t("fail")+'</h1><p class="mute">'+(code==="banned"?t("banned"):code==="no_tg"?t("openTg"):"")+'</p><p class="mute sm">'+esc(code)+'</p>'+(code==="banned"?"":'<button class="pill on" style="padding:14px 28px" onclick="boot()">'+t("retry")+'</button>')+'</div>'}
window.addEventListener("pagehide",function(){if(UID)saveCache()});document.addEventListener("visibilitychange",function(){if(document.hidden&&UID)saveCache()});
function lsG(k){try{return localStorage.getItem(k)}catch(e){return null}}
function lsS(k,v){try{localStorage.setItem(k,v)}catch(e){}}
/* Снимок данных с прошлого запуска: показываем его сразу, свежие данные подгружаем в фоне */
function saveCache(){try{localStorage.setItem("ww_cache",JSON.stringify({v:2,uid:UID,at:Date.now(),DB:DB,MY:MY,MYT:MYT,RT:RT,ME:ME,PRG:PRG,NT:NT,SUBS:SUBS}))}catch(e){try{localStorage.removeItem("ww_cache")}catch(e2){}}}
function applyCache(){var c;try{c=JSON.parse(lsG("ww_cache")||"null")}catch(e){c=null}
  if(!c||c.v!==2||c.uid!==UID||Date.now()-c.at>14*864e5)return false;
  DB=c.DB;MY=c.MY||{};MYT=c.MYT||{};RT=c.RT||{};ME=c.ME||{};PRG=c.PRG||{};NT=c.NT||[];SUBS=c.SUBS||{};return true}
async function tgAuth(){var r=await fetch(SB_URL+"/functions/v1/telegram-auth",{method:"POST",headers:{"Content-Type":"application/json",apikey:SB_KEY},body:JSON.stringify({initData:tg.initData})}),j=await r.json().catch(function(){return{}});
  return{ok:r.ok,status:r.status,j:j}}
async function boot(){
  if(!document.getElementById("splash"))app.innerHTML='<div class="center mute">…</div>';
  try{
    var tgId=tg&&tg.initDataUnsafe&&tg.initDataUnsafe.user&&String(tg.initDataUnsafe.user.id),s=await sb.auth.getSession();
    if(tg&&tg.initData){
      if(s.data.session&&tgId&&lsG("ww_tg")===tgId){
        /* Уже входили с этого устройства: не ждём функцию входа, а проверяем её в фоне (последний визит, бан) */
        tgAuth().then(function(a){if(!a.ok&&a.j&&a.j.error==="banned")fail("banned")},function(){});
      }else{
        var a=await tgAuth();if(!a.ok)return fail(a.j.error||"http_"+a.status);
        var ss=await sb.auth.setSession({access_token:a.j.access_token,refresh_token:a.j.refresh_token});if(ss.error)return fail("session");
        if(tgId)lsS("ww_tg",tgId);s=await sb.auth.getSession();
      }
    }
    if(!s.data.session)return fail("no_tg");
    UID=s.data.session.user.id;
    var sp=(tg&&tg.initDataUnsafe&&tg.initDataUnsafe.start_param)||"",qp=new URLSearchParams(location.search).get("t"),tid=/^t(\d+)$/.exec(sp);tid=tid?Number(tid[1]):(qp?Number(qp):null);
    var shown=applyCache();
    if(shown){render();hideSplash();if(tid&&T_(tid))openTitle(tid)}
    try{await load()}catch(e){if(!shown)throw e;console.error(e);return}
    saveCache();render();
    if(!shown){hideSplash();if(tid&&T_(tid))openTitle(tid)}
    track("app_open");
    sb.rpc("evaluate_my_achievements").then(function(){setTimeout(function(){refreshAch(true)},2200)},function(){});
  }catch(err){console.error(err);fail(String(err&&err.message||err).slice(0,80))}
}
boot();
</script>
