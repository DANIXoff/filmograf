<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Want Watch</title>
<style>
:root{--bg:#fff;--s1:#f3f3f6;--s2:#e8e8ee;--ink:#111114;--mute:#7b7b86;--acc:#6f5cff;--accInk:#fff;--line:#e6e6ec;--glass:rgba(255,255,255,.72);--red:#e5484d;color-scheme:light}
[data-theme=dark]{--bg:#0b0b0e;--s1:#17171c;--s2:#24242b;--ink:#f4f4f7;--mute:#8e8e99;--line:#26262d;--glass:rgba(40,40,48,.62);color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html:not([data-theme]){background:#000}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 -apple-system,"SF Pro Text","Segoe UI",system-ui,sans-serif}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
#app{max-width:520px;margin:0 auto;min-height:100vh;padding:calc(env(safe-area-inset-top,0px) + 10px) 0 calc(env(safe-area-inset-bottom,0px) + 110px)}
.pad{padding:0 16px}
.top{display:flex;align-items:center;justify-content:space-between;padding:6px 16px 14px}
.logo{font-weight:800;letter-spacing:.14em;font-size:15px;display:flex;align-items:center}
.ib{width:40px;height:40px;border-radius:50%;background:var(--s1);display:grid;place-items:center;flex:none}
.ib.ph{visibility:hidden}
h1{font-size:22px;line-height:1.2;margin:0 0 6px}h2{font-size:18px;margin:22px 16px 10px}
.mute{color:var(--mute)}.sm{font-size:13px}
.slider{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;padding:0 16px;scrollbar-width:none}.slider::-webkit-scrollbar{display:none}
.slide{flex:0 0 86%;aspect-ratio:16/9;border-radius:20px;position:relative;overflow:hidden;scroll-snap-align:center;background:var(--s2)}
.slide.one{flex-basis:100%}
.slide img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.sov{position:absolute;inset:auto 0 0 0;padding:34px 16px 14px;background:linear-gradient(transparent,rgba(0,0,0,.78));color:#fff;display:flex;flex-direction:column;gap:4px}
.sov b{font-size:19px}.sov span{font-size:13px;opacity:.85}
.sbtn{align-self:flex-start;margin-top:6px;background:#fff;color:#111;border-radius:999px;padding:7px 14px;font-weight:600;font-size:13px}
.dots{display:flex;justify-content:center;gap:6px;margin:10px 0 4px}.dots i{width:6px;height:6px;border-radius:50%;background:var(--s2)}.dots i.on{background:var(--ink)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:12px 16px}
.tile{background:var(--s1);border-radius:20px;aspect-ratio:1/1.05;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:12px;font-weight:600}
.tile .em{font-size:44px;line-height:1}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;padding:0 16px}
.pc{text-align:left;display:flex;flex-direction:column;gap:4px;font-size:13px;min-width:0}.pc b{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pimg{aspect-ratio:2/3;border-radius:12px;background:var(--s2);object-fit:cover;width:100%;display:block}
.hs{display:flex;gap:12px;overflow-x:auto;padding:0 16px;scrollbar-width:none}.hs::-webkit-scrollbar{display:none}.hs .pc{flex:0 0 112px}
.head{display:flex;gap:16px;padding:0 16px}.head .pimg{width:112px;flex:none}
.chips{display:flex;flex-wrap:wrap;gap:8px;padding:14px 16px 0}
.chip{background:var(--s1);border-radius:999px;padding:7px 13px;font-size:13px;font-weight:500}
.desc{padding:14px 16px 0;position:relative}
.sqb{display:inline-grid;place-items:center;width:26px;height:22px;border-radius:6px;background:var(--s2);font-weight:700;vertical-align:middle;margin:0 4px;line-height:1}
.pills{display:flex;gap:10px;padding:16px 16px 6px}.pill{flex:1;background:var(--s1);border-radius:999px;padding:15px 8px;font-weight:600;text-align:center}.pill.on{background:var(--ink);color:var(--bg)}
.row{display:flex;align-items:center;gap:14px;padding:16px;border-top:1px solid var(--line);width:100%;text-align:left}.row:first-of-type{border-top:0}
.row .grow{flex:1;min-width:0}.row small{display:block;color:var(--mute);font-size:13px}.row.red{color:var(--red)}
.rb{width:42px;height:42px;border-radius:12px;background:var(--s2);display:grid;place-items:center;flex:none}
.grp{background:var(--s1);border-radius:20px;margin:0 16px 14px;overflow:hidden}.grp .row:first-child{border-top:0}
.cap{margin:20px 20px 8px;color:var(--mute);font-weight:600;font-size:14px}
.stack{display:flex}.stack img,.stack i{width:26px;height:26px;border-radius:50%;border:2px solid var(--s1);margin-left:-8px;object-fit:cover;background:var(--s2)}
.nav{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);display:flex;justify-content:center;gap:10px;z-index:20;pointer-events:none}
.pillnav{display:flex;gap:4px;padding:6px;border-radius:999px;background:var(--glass);backdrop-filter:blur(22px) saturate(1.6);-webkit-backdrop-filter:blur(22px) saturate(1.6);box-shadow:0 6px 24px rgba(0,0,0,.14);pointer-events:auto}
.nb{width:64px;height:52px;border-radius:999px;display:grid;place-items:center;color:var(--mute)}.nb.on{background:var(--s2);color:var(--ink)}
.sbub{width:64px;height:64px;border-radius:50%;background:var(--glass);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);box-shadow:0 6px 24px rgba(0,0,0,.14);display:grid;place-items:center;pointer-events:auto;align-self:center}
.ov{position:fixed;inset:0;background:var(--bg);z-index:40;padding:calc(env(safe-area-inset-top,0px) + 12px) 16px 20px;overflow-y:auto}
.sbar{display:flex;gap:10px;align-items:center}.sbar input{flex:1;height:46px;border-radius:999px;border:0;background:var(--s1);color:var(--ink);padding:0 18px;font:inherit;outline:0}
.sheetbg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:50;display:flex;align-items:flex-end}
.sheet{background:var(--bg);width:100%;max-width:520px;margin:0 auto;border-radius:24px 24px 0 0;padding:10px 0 calc(env(safe-area-inset-bottom,0px) + 14px);max-height:80vh;overflow-y:auto}
.sheet:before{content:"";display:block;width:40px;height:4px;border-radius:2px;background:var(--s2);margin:0 auto 6px}
.ico{width:44px;height:44px;border-radius:50%;object-fit:cover;background:var(--s2);flex:none}
.av{width:84px;height:84px;border-radius:50%;background:var(--s2);object-fit:cover;display:grid;place-items:center;font-size:32px;font-weight:700;margin:0 auto 10px}
.center{text-align:center;padding:60px 24px}
.tabs{display:flex;gap:8px;padding:14px 0}.tabs button{flex:1;padding:11px;border-radius:12px;background:var(--s1);font-weight:600}.tabs .on{background:var(--ink);color:var(--bg)}
.toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;z-index:99;font-size:14px}

#splash{position:fixed;inset:0;background:#000;z-index:200;display:grid;place-items:center;transition:opacity .4s}
#splash.off{opacity:0;pointer-events:none}
#splash img{width:min(54vw,230px);height:auto;animation:wwp 1.15s ease-in-out infinite alternate}
@keyframes wwp{from{opacity:.1;filter:brightness(.55)}to{opacity:1;filter:brightness(1.12)}}
.logo img{height:24px;width:auto;display:block}
.chips{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}.chip{flex:none;white-space:nowrap}
.hero{position:relative;margin:0 16px;border-radius:22px;overflow:hidden;aspect-ratio:16/9;background:var(--s2)}
.hero>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.hero:after{content:"";position:absolute;inset:0;background:linear-gradient(rgba(0,0,0,.28),transparent 38%,rgba(0,0,0,.34));pointer-events:none}
.hbtn{position:absolute;top:10px;width:40px;height:40px;border-radius:50%;background:rgba(0,0,0,.4);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);color:#fff;display:grid;place-items:center;z-index:2}
.hbtn.l{left:10px}.hbtn.r{right:10px}
.hplay{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:64px;height:64px;border-radius:50%;background:rgba(255,255,255,.9);color:#111;display:grid;place-items:center;z-index:2;box-shadow:0 6px 24px rgba(0,0,0,.32)}
.hplay svg{fill:currentColor}
.head.hv{margin-top:-52px;position:relative;z-index:3}
.head.hv .pimg{box-shadow:0 10px 30px rgba(0,0,0,.38)}
.head.hv .meta{padding-top:60px}
.pill{display:flex;align-items:center;justify-content:center;gap:7px;white-space:nowrap;font-size:14px;padding:14px 6px}
.tile span:last-child{line-height:1.25;text-wrap:balance}
.rl{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;flex:none;overflow:hidden;object-fit:cover}
.rl.ww{background:var(--s2)}.rl.ww img{width:30px;height:auto}
.rl.imdb{background:#f5c518;color:#000;font:900 12.5px/1 Arial,Helvetica,sans-serif;letter-spacing:-.4px}
.rl.rt{background:#fff;border:1px solid var(--line)}
.rl.kp{background:#ff5500;color:#fff;font:800 15px/1 -apple-system,Arial,sans-serif}
</style>
</head>

function morph(a,b){
  var ac=a.childNodes,bc=b.childNodes,i,x,y;
  for(i=0;i<bc.length;i++){
    x=ac[i];y=bc[i];
    if(!x){a.appendChild(y.cloneNode(true));continue}
    if(x.nodeType!==y.nodeType||x.nodeName!==y.nodeName||(x.nodeType===1&&x.getAttribute("data-k")!==y.getAttribute("data-k"))){a.replaceChild(y.cloneNode(true),x);continue}
    if(x.nodeType!==1){if(x.nodeValue!==y.nodeValue)x.nodeValue=y.nodeValue;continue}
    var j,at;
    for(j=0;j<y.attributes.length;j++){at=y.attributes[j];if(x.getAttribute(at.name)!==at.value)x.setAttribute(at.name,at.value)}
    for(j=x.attributes.length-1;j>=0;j--){at=x.attributes[j];if(!y.hasAttribute(at.name))x.removeAttribute(at.name)}
    if(x.nodeName==="INPUT"&&x!==document.activeElement&&x.value!==y.value)x.value=y.value;
    morph(x,y);
  }
  while(ac.length>bc.length)a.removeChild(a.lastChild)}

    case"share":var nmx=nm(D[pg.id]);return ext("https://t.me/share/url?url="+encodeURIComponent(shareLink(pg.id))+"&text="+encodeURIComponent(nmx));
    case"onl":S.sheet={n:"onl",id:pg.id};track("open_providers",{title_id:pg.id});return render();
    case"rsheet":S.sheet={n:"rat",id:pg.id};return render();
    case"sclose":S.sheet=null;return render();
    case"prov":track("click_provider",{title_id:pg.id,provider_id:Number(p[1])});var q=(D[pg.id].prov||[]).find(function(z){return z.provider_id===Number(p[1])});return ext(q&&q.url);
    case"lnk":var u=DB.links[p[1]]||(D[pg.id]&&D[pg.id][p[1]+"_url"]);return ext(u);
    case"rt":pg.tab=p[1];return render();
    case"so":S.search=true;S.focused=0;return render();
    case"sx":S.search=false;S.focused=0;return render();
    case"sgo":return goSearch();
    case"addhome":try{tg.addToHomeScreen()}catch(err){}return;
    case"del":if(!confirm(t("delQ")))return;var r=await sb.rpc("delete_my_account");if(r.error)return toast("Error");await sb.auth.signOut();if(tg&&tg.close)tg.close();return;
  }});

/* ---------- старт и вход ---------- */
function fail(code){hideSplash();app.innerHTML='<div class="center"><h1>'+t("fail")+'</h1><p class="mute">'+(code==="banned"?t("banned"):code==="no_tg"?t("openTg"):"")+'</p><p class="mute sm">'+esc(code)+'</p>'+(code==="banned"?"":'<button class="pill on" style="padding:14px 28px" onclick="boot()">'+t("retry")+'</button>')+'</div>'}
async function boot(){
  if(!document.getElementById("splash"))app.innerHTML='<div class="center mute">…</div>';
  try{
    if(tg&&tg.initData){
      var r=await fetch(SB_URL+"/functions/v1/telegram-auth",{method:"POST",headers:{"Content-Type":"application/json",apikey:SB_KEY},body:JSON.stringify({initData:tg.initData})}),j=await r.json().catch(function(){return{}});
      if(!r.ok)return fail(j.error||"http_"+r.status);
      var ss=await sb.auth.setSession({access_token:j.access_token,refresh_token:j.refresh_token});if(ss.error)return fail("session");
    }
    var s=await sb.auth.getSession();if(!s.data.session)return fail("no_tg");
    UID=s.data.session.user.id;await load();
    var sp=(tg&&tg.initDataUnsafe&&tg.initDataUnsafe.start_param)||"",qp=new URLSearchParams(location.search).get("t"),tid=/^t(\d+)$/.exec(sp);tid=tid?Number(tid[1]):(qp?Number(qp):null);
    render();hideSplash();if(tid&&T_(tid))openTitle(tid);
  }catch(err){console.error(err);fail(String(err&&err.message||err).slice(0,80))}
}
boot();
</script>
