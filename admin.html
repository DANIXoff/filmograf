<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Фильмограф — админка</title>
<style>
:root{--bg:#f5f5f7;--card:#fff;--ink:#1b1b1f;--mute:#707078;--line:#e4e4ea;--acc:#1b1b1f;--accInk:#fff;--chip:#ececf1;--red:#d93a2f;--ok:#2e9e57;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#0e0e11;--card:#17171c;--ink:#f2f2f5;--mute:#9a9aa5;--line:#2a2a32;--acc:#f2f2f5;--accInk:#0e0e11;--chip:#23232b;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,"Segoe UI",sans-serif}
#app{max-width:760px;margin:0 auto;padding:18px 14px 60px}
h1{font-size:20px;margin:0 0 14px}h2{font-size:15px;margin:0 0 12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px}
label{display:block;font-size:13px;color:var(--mute);margin-bottom:10px}
input,select,textarea{display:block;width:100%;margin-top:4px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit}
textarea{min-height:90px;resize:vertical}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
.btn{border:0;border-radius:10px;padding:10px 16px;background:var(--chip);color:var(--ink);font:600 14px inherit;cursor:pointer}
.btn.pri{background:var(--acc);color:var(--accInk)}.btn.red{background:var(--red);color:#fff}.btn.sm{padding:6px 10px;font-size:13px}
.row{display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap}.row>*{flex:1;min-width:120px}.row>.btn{flex:none}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;align-items:center}.bar .sp{flex:1}
.tabs{display:inline-flex;background:var(--chip);border-radius:10px;padding:3px}.tabs button{border:0;background:none;color:var(--ink);padding:7px 16px;border-radius:8px;font:600 14px inherit;cursor:pointer}.tabs .on{background:var(--card)}
.chips{display:flex;flex-wrap:wrap;gap:6px}.chip{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:6px 12px;font:600 13px inherit;cursor:pointer}.chip.on{background:var(--acc);color:var(--accInk);border-color:var(--acc)}
.item{display:flex;gap:12px;align-items:center;width:100%;text-align:left;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:8px;margin-bottom:8px;cursor:pointer;font:inherit}
.item img,.ph{width:42px;height:62px;border-radius:6px;object-fit:cover;background:var(--chip);flex:none}
.item small{color:var(--mute);display:block}.badge{font-size:12px;padding:2px 8px;border-radius:999px;background:var(--chip);margin-left:auto;flex:none}.badge.pub{background:var(--ok);color:#fff}
.sub{border-left:3px solid var(--line);padding-left:12px;margin:10px 0}
.ep{display:grid;grid-template-columns:24px 1fr auto;gap:8px;align-items:start;margin-bottom:8px}.ep span{padding-top:12px;color:var(--mute);font-size:13px}.ep textarea{min-height:56px}
.prev{max-height:170px;border-radius:8px;margin-top:8px;display:block}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;z-index:9}
.mute{color:var(--mute);font-size:13px}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
</head>
<body>
<div id="app"></div>
<script>
var SB_URL="https://rixjsfvweagsqrvoiymj.supabase.co",SB_KEY="sb_publishable_XlyUk5LlVt3Cdt20laz6fw_HyjKJH1y";
var sb=window.supabase.createClient(SB_URL,SB_KEY);
var app=document.getElementById("app");
var G={genres:[],providers:[],titles:[],tab:"movie",view:"login"},E=null;
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function toast(t){var d=document.createElement("div");d.className="toast";d.textContent=t;document.body.appendChild(d);setTimeout(function(){d.remove()},3000)}
function nz(v){return v===""||v==null?null:v}
function setP(o,p,v){var k=p.split(".");for(var i=0;i<k.length-1;i++)o=o[k[i]];o[k[k.length-1]]=v}
function fmtRt(m){if(!m)return"";var h=Math.floor(m/60),r=m%60;return"В приложении: "+(h?h+" ч ":"")+(r?r+" мин":"")}
function blank(kind){return{id:null,kind:kind,code:"",title:"",original_title:"",description_short:"",description_full:"",year_start:null,year_end:null,runtime_min:null,poster_url:null,trailer_url:"",comments_url:"",kp_url:"",imdb_url:"",rt_url:"",rating_kp:null,rating_imdb:null,rating_rt:null,has_watch:false,status:"draft",genre_ids:[],providers:[],seasons:[]}}

async function upload(file,dir){
  var ext=(file.name.split(".").pop()||"jpg").toLowerCase().replace(/[^a-z0-9]/g,"");
  var path=dir+"/"+Date.now()+"-"+Math.random().toString(36).slice(2,8)+"."+ext;
  var r=await sb.storage.from("media").upload(path,file,{contentType:file.type});
  if(r.error)throw r.error;
  return sb.storage.from("media").getPublicUrl(path).data.publicUrl;
}
async function loadAll(){
  var r=await Promise.all([sb.from("genres").select("*").order("sort"),sb.from("providers").select("*").order("name"),
    sb.from("titles").select("id,kind,code,title,status,poster_url,year_start,year_end").order("id",{ascending:false})]);
  G.genres=r[0].data||[];G.providers=r[1].data||[];G.titles=r[2].data||[];
}
async function boot(){
  var s=await sb.auth.getSession();
  if(s.data.session){var a=await sb.rpc("is_admin");if(a.data===true){await loadAll();G.view="list";return render()}}
  G.view="login";render();
}

/* ---------- экраны ---------- */
function fld(l,p,v,x){return '<label>'+l+'<input data-p="'+p+'" value="'+esc(v)+'" '+(x||"")+'></label>'}
function num(l,p,v){return fld(l,p,v,'data-n="1" inputmode="decimal"')}
function years(p,v,blankLbl){var o=blankLbl?'<option value="">'+blankLbl+'</option>':'<option value="">—</option>';
  for(var y=new Date().getFullYear()+2;y>=1900;y--)o+='<option value="'+y+'"'+(v===y?" selected":"")+'>'+y+'</option>';
  return '<select data-p="'+p+'" data-n="1">'+o+'</select>'}
var V={
login:function(){return '<div class="card" style="max-width:380px;margin:60px auto"><h1>Фильмограф · админка</h1><label>Почта<input id="em" type="email" autocomplete="username"></label><label>Пароль<input id="pw" type="password" autocomplete="current-password"></label><button class="btn pri" data-a="login" style="width:100%">Войти</button></div>'},
list:function(){
  var k=G.tab,rows=G.titles.filter(function(t){return t.kind===k});
  return '<div class="bar"><h1 style="margin:0">Контент</h1><span class="sp"></span><button class="btn sm" data-a="provcat">Кинотеатры</button><button class="btn sm" data-a="logout">Выйти</button></div>'+
  '<div class="bar"><div class="tabs"><button class="'+(k==="movie"?"on":"")+'" data-a="tab:movie">Фильмы</button><button class="'+(k==="series"?"on":"")+'" data-a="tab:series">Сериалы</button></div><span class="sp"></span><button class="btn pri" data-a="new">+ Добавить</button></div>'+
  (rows.length?rows.map(function(t){return '<button class="item" data-a="edit:'+t.id+'">'+(t.poster_url?'<img src="'+esc(t.poster_url)+'" alt="">':'<span class="ph"></span>')+'<span><b>'+esc(t.title)+'</b><small>'+esc(t.code||"без кода")+' · '+(t.year_start||"—")+(t.kind==="series"?"–"+(t.year_end||""):"")+'</small></span><span class="badge '+(t.status==="published"?"pub":"")+'">'+(t.status==="published"?"опубликовано":"черновик")+'</span></button>'}).join(""):'<div class="card mute">Здесь пока пусто. Нажмите «+ Добавить».</div>')},
provcat:function(){
  return '<div class="bar"><button class="btn sm" data-a="back">← Назад</button><h1 style="margin:0">Онлайн-кинотеатры</h1></div>'+
  G.providers.map(function(p){return '<div class="item" style="cursor:default">'+(p.icon_url?'<img src="'+esc(p.icon_url)+'" alt="" style="width:42px;height:42px;border-radius:50%">':'<span class="ph" style="height:42px;border-radius:50%"></span>')+'<b>'+esc(p.name)+'</b><button class="btn red sm" style="margin-left:auto" data-a="delprov:'+p.id+'">Удалить</button></div>'}).join("")+
  '<div class="card"><h2>Добавить кинотеатр</h2><div class="row"><label>Название<input id="pn"></label><label>Иконка (квадратная)<input id="pi" type="file" accept="image/*"></label><button class="btn pri" data-a="addprov">Добавить</button></div></div>'},
ed:function(){
  var k=E.kind,gs=G.genres.filter(function(g){return g.kind===k}),h='<div class="bar"><button class="btn sm" data-a="back">← Назад</button><h1 style="margin:0">'+(E.id?"Редактирование":"Новый")+(k==="movie"?" фильм":" сериал")+'</h1></div>';
  h+='<div class="card">'+(E.id?"":'<div class="tabs" style="margin-bottom:12px"><button class="'+(k==="movie"?"on":"")+'" data-a="kind:movie">Фильм</button><button class="'+(k==="series"?"on":"")+'" data-a="kind:series">Сериал</button></div>')+
   fld("Название","title",E.title)+fld("Оригинальное название","original_title",E.original_title)+
   '<div class="row"><label>Код (буква и цифры, например D0003)<input data-p="code" id="code" value="'+esc(E.code)+'"></label><label>Буква жанра<input id="let" maxlength="1" placeholder="D"></label><button class="btn" data-a="next">Подобрать код</button></div>'+
   '<label style="margin-top:10px">Статус<select data-p="status"><option value="draft"'+(E.status==="draft"?" selected":"")+'>Черновик (не виден в приложении)</option><option value="published"'+(E.status==="published"?" selected":"")+'>Опубликовано</option></select></label></div>';
  h+='<div class="card"><h2>Годы и время</h2><div class="row">'+(k==="movie"?'<label>Год выхода'+years("year_start",E.year_start)+'</label>':'<label>Начало'+years("year_start",E.year_start)+'</label><label>Конец'+years("year_end",E.year_end,"— (выходит сейчас)")+'</label>')+
   num(k==="movie"?"Длительность, мин":"Средняя серия, мин","runtime_min",E.runtime_min).replace("<label>",'<label style="margin:0">')+'</div><div class="mute" id="rth">'+fmtRt(E.runtime_min)+'</div></div>';
  h+='<div class="card"><h2>Жанры</h2><div class="chips">'+gs.map(function(g){return '<button class="chip'+(E.genre_ids.indexOf(g.id)>-1?" on":"")+'" data-a="g:'+g.id+'">'+esc(g.emoji)+" "+esc(g.name)+'</button>'}).join("")+'</div><div class="row" style="margin-top:12px"><label style="flex:0 0 70px;margin:0">Эмодзи<input id="ng-e" maxlength="4" placeholder="📖"></label><label style="margin:0">Новый жанр<input id="ng-n" placeholder="Биография"></label><label style="margin:0;display:flex;gap:6px;align-items:center;color:var(--ink);flex:none"><input type="checkbox" id="ng-b" checked style="width:auto;margin:0"> и для '+(k==="movie"?"сериалов":"фильмов")+'</label><button class="btn" data-a="addgenre">+ Жанр</button></div></div>';
  h+='<div class="card"><h2>Описание и обложка</h2><label>Описание «Вкратце» (видно сразу)<textarea data-p="description_short">'+esc(E.description_short)+'</textarea></label><label>Описание «Подробнее» (открывается по кнопке «…»)<textarea data-p="description_full" style="min-height:140px">'+esc(E.description_full)+'</textarea></label><label>Обложка (вертикальная)<input id="poster" type="file" accept="image/*"></label>'+(E.poster_url?'<img class="prev" src="'+esc(E.poster_url)+'" alt="Обложка">':"")+fld("Трейлер (ссылка на YouTube)","trailer_url",E.trailer_url)+
   (k==="movie"?fld("Ссылка на комментарии под постом в канале","comments_url",E.comments_url):"")+'</div>';
  h+='<div class="card"><h2>Рейтинги и ссылки</h2><div class="row">'+fld("КиноПоиск, ссылка","kp_url",E.kp_url)+num("Рейтинг КП","rating_kp",E.rating_kp)+'</div><div class="row">'+fld("IMDb, ссылка","imdb_url",E.imdb_url)+num("Рейтинг IMDb","rating_imdb",E.rating_imdb)+'</div><div class="row">'+fld("Rotten Tomatoes, ссылка","rt_url",E.rt_url)+num("RT, %","rating_rt",E.rating_rt)+'</div></div>';
  h+='<div class="card"><h2>Смотреть онлайн</h2><label style="display:flex;gap:8px;align-items:center;color:var(--ink)"><input type="checkbox" data-p="has_watch" data-re="1" style="width:auto;margin:0"'+(E.has_watch?" checked":"")+'> Показывать кнопку «Смотреть онлайн»</label>';
  if(E.has_watch){h+=E.providers.map(function(p,i){return '<div class="row" style="margin-bottom:8px"><label style="margin:0">Кинотеатр<select data-p="providers.'+i+'.provider_id" data-n="1"><option value="">выберите</option>'+G.providers.map(function(x){return '<option value="'+x.id+'"'+(p.provider_id===x.id?" selected":"")+'>'+esc(x.name)+'</option>'}).join("")+'</select></label>'+fld("Ссылка","providers."+i+".url",p.url).replace("<label>",'<label style="margin:0">')+fld("Пометка под названием","providers."+i+".note",p.note,'placeholder="Подписка"').replace("<label>",'<label style="margin:0">')+'<button class="btn red sm" data-a="delpv:'+i+'">✕</button></div>'}).join("")+
   '<button class="btn sm" data-a="addpv">+ Кинотеатр</button>'+(G.providers.length?"":' <span class="mute">Сначала добавьте кинотеатры в каталоге.</span>')}
  h+='</div>';
  if(k==="series"){
    h+='<div class="card"><h2>Сезоны и серии</h2>'+E.seasons.map(function(s,i){
      return '<div class="sub"><div class="row"><b style="flex:none;align-self:center">Сезон '+(i+1)+'</b>'+fld("Название (необязательно)","seasons."+i+".name",s.name).replace("<label>",'<label style="margin:0">')+'<button class="btn sm" data-a="bulk:'+i+'">Создать N серий</button><button class="btn red sm" data-a="delseason:'+i+'">Удалить сезон</button></div><div style="margin-top:10px">'+
      s.episodes.map(function(e,j){return '<div class="ep"><span>'+(j+1)+'</span><div><input data-p="seasons.'+i+'.episodes.'+j+'.name" value="'+esc(e.name)+'" placeholder="Название серии"><textarea data-p="seasons.'+i+'.episodes.'+j+'.description" placeholder="Описание серии">'+esc(e.description)+'</textarea></div><button class="btn red sm" data-a="delep:'+i+':'+j+'">✕</button></div>'}).join("")+
      '<button class="btn sm" data-a="addep:'+i+'">+ Серия</button></div></div>'}).join("")+'<button class="btn" data-a="addseason">+ Сезон</button></div>';
  }
  h+='<div class="bar"><button class="btn pri" data-a="save">Сохранить</button><button class="btn" data-a="back">Отмена</button><span class="sp"></span>'+(E.id?'<button class="btn red" data-a="del">Удалить</button>':"")+'</div>';
  return h}
};
function render(){var y=window.scrollY;app.innerHTML=V[G.view]();if(G.view==="ed")window.scrollTo(0,y)}

/* ---------- сохранение ---------- */
async function save(){
  try{
    var code=(E.code||"").toUpperCase().trim().replace(/[АВЕКМНОРСТХ]/g,function(c){return"ABEKMHOPCTX"["АВЕКМНОРСТХ".indexOf(c)]});
    if(!E.title.trim())return toast("Укажите название");
    if(code&&!/^[A-Z]\d{4,}$/.test(code))return toast("Код: одна английская буква и не менее четырёх цифр");
    var row={kind:E.kind,code:code||null,title:E.title.trim(),original_title:nz(E.original_title),description_short:E.description_short||"",description_full:E.description_full||"",year_start:E.year_start,year_end:E.kind==="series"?E.year_end:null,runtime_min:E.runtime_min,
      poster_url:E.poster_url,trailer_url:nz(E.trailer_url),comments_url:E.kind==="movie"?nz(E.comments_url):null,kp_url:nz(E.kp_url),imdb_url:nz(E.imdb_url),rt_url:nz(E.rt_url),
      rating_kp:E.rating_kp,rating_imdb:E.rating_imdb,rating_rt:E.rating_rt,has_watch:E.has_watch,status:E.status,ratings_updated_at:(E.rating_kp!=null||E.rating_imdb!=null||E.rating_rt!=null)?new Date().toISOString():null};
    var r=E.id?await sb.from("titles").update(row).eq("id",E.id).select("id").single():await sb.from("titles").insert(row).select("id").single();
    if(r.error)return toast(/duplicate|unique/i.test(r.error.message)?"Этот код уже занят":"Ошибка: "+r.error.message);
    var id=r.data.id,x;
    x=await sb.from("title_genres").delete().eq("title_id",id);if(x.error)throw x.error;
    if(E.genre_ids.length){x=await sb.from("title_genres").insert(E.genre_ids.map(function(g){return{title_id:id,genre_id:g}}));if(x.error)throw x.error}
    x=await sb.from("title_providers").delete().eq("title_id",id);if(x.error)throw x.error;
    var seen={},pv=E.has_watch?E.providers.filter(function(p){if(!p.provider_id||!p.url||seen[p.provider_id])return false;seen[p.provider_id]=1;return true}).map(function(p,i){return{title_id:id,provider_id:p.provider_id,url:p.url,note:nz(p.note),sort:i}}):[];
    if(pv.length){x=await sb.from("title_providers").insert(pv);if(x.error)throw x.error}
    if(E.kind==="series"){
      // Сезоны и серии обновляем «по номеру», а не пересоздаём: так не теряются отметки пользователей
      for(var i=0;i<E.seasons.length;i++){
        var s=E.seasons[i];
        var sr=await sb.from("seasons").upsert({title_id:id,number:i+1,name:nz(s.name)},{onConflict:"title_id,number"}).select("id").single();if(sr.error)throw sr.error;
        if(s.episodes.length){x=await sb.from("episodes").upsert(s.episodes.map(function(e,j){return{season_id:sr.data.id,number:j+1,name:e.name||"",description:e.description||""}}),{onConflict:"season_id,number"});if(x.error)throw x.error}
        x=await sb.from("episodes").delete().eq("season_id",sr.data.id).gt("number",s.episodes.length);if(x.error)throw x.error;
      }
      x=await sb.from("seasons").delete().eq("title_id",id).gt("number",E.seasons.length);if(x.error)throw x.error;
    }
    await loadAll();G.tab=E.kind;G.view="list";toast("Сохранено ✓");render();
  }catch(e){console.error(e);toast("Ошибка: "+(e.message||e))}
}
async function openEd(id){
  if(!id){E=blank(G.tab);G.view="ed";return render()}
  var r=await Promise.all([sb.from("titles").select("*").eq("id",id).single(),sb.from("title_genres").select("genre_id").eq("title_id",id),
    sb.from("title_providers").select("*").eq("title_id",id).order("sort"),sb.from("seasons").select("*, episodes(*)").eq("title_id",id).order("number")]);
  if(r[0].error)return toast("Не удалось открыть");
  E=Object.assign(blank(r[0].data.kind),r[0].data,{
    genre_ids:(r[1].data||[]).map(function(x){return x.genre_id}),
    providers:(r[2].data||[]).map(function(x){return{provider_id:x.provider_id,url:x.url,note:x.note||""}}),
    seasons:(r[3].data||[]).map(function(s){return{name:s.name||"",episodes:(s.episodes||[]).sort(function(a,b){return a.number-b.number}).map(function(e){return{name:e.name,description:e.description}})}})});
  ["code","original_title","trailer_url","comments_url","kp_url","imdb_url","rt_url","description_short","description_full"].forEach(function(f){if(E[f]==null)E[f]=""});
  G.view="ed";render();
}

/* ---------- события ---------- */
app.addEventListener("input",function(e){var t=e.target,p=t.dataset.p;if(!p)return;
  var v=t.type==="checkbox"?t.checked:t.value;if(t.dataset.n)v=v===""?null:Number(String(v).replace(",","."));
  setP(E,p,v);if(p==="runtime_min"){var h=document.getElementById("rth");if(h)h.textContent=fmtRt(v)}if(t.dataset.re)render()});
app.addEventListener("change",async function(e){var t=e.target;
  try{if(t.id==="poster"&&t.files[0]){E.poster_url=await upload(t.files[0],"posters");render()}}catch(err){toast("Не удалось загрузить: "+err.message)}});
app.addEventListener("click",async function(e){
  var b=e.target.closest("[data-a]");if(!b)return;var a=b.dataset.a.split(":"),i,j;
  try{switch(a[0]){
    case"login":var r=await sb.auth.signInWithPassword({email:document.getElementById("em").value.trim(),password:document.getElementById("pw").value});
      if(r.error)return toast("Неверная почта или пароль");
      var ad=await sb.rpc("is_admin");if(ad.data!==true){await sb.auth.signOut();return toast("У этого аккаунта нет прав администратора")}
      await loadAll();G.view="list";return render();
    case"logout":await sb.auth.signOut();G.view="login";return render();
    case"tab":G.tab=a[1];return render();
    case"new":return openEd(null);
    case"edit":return openEd(Number(a[1]));
    case"back":G.view="list";return render();
    case"provcat":G.view="provcat";return render();
    case"kind":E.kind=a[1];E.genre_ids=[];return render();
    case"g":i=Number(a[1]);E.genre_ids.indexOf(i)>-1?E.genre_ids.splice(E.genre_ids.indexOf(i),1):E.genre_ids.push(i);return render();
    case"next":var l=(document.getElementById("let").value||"").toUpperCase().charAt(0);if(!/[A-Z]/.test(l))return toast("Введите английскую букву жанра, например D");
      var mx=0;G.titles.forEach(function(t){if(t.code&&t.code.charAt(0)===l)mx=Math.max(mx,parseInt(t.code.slice(1),10))});
      E.code=l+String(mx+1).padStart(4,"0");return render();
    case"addpv":E.providers.push({provider_id:null,url:"",note:""});return render();
    case"delpv":E.providers.splice(Number(a[1]),1);return render();
    case"addseason":E.seasons.push({name:"",episodes:[]});return render();
    case"delseason":if(confirm("Удалить сезон со всеми сериями?")){E.seasons.splice(Number(a[1]),1);render()}return;
    case"addep":E.seasons[Number(a[1])].episodes.push({name:"",description:""});return render();
    case"delep":E.seasons[Number(a[1])].episodes.splice(Number(a[2]),1);return render();
    case"bulk":var n=parseInt(prompt("Сколько серий создать?","8"),10);if(n>0&&n<=100){for(j=0;j<n;j++)E.seasons[Number(a[1])].episodes.push({name:"",description:""});render()}return;
    case"addgenre":var gn=document.getElementById("ng-n").value.trim(),ge=document.getElementById("ng-e").value.trim()||"🎬";if(!gn)return toast("Введите название жанра");
      var kinds=document.getElementById("ng-b").checked?["movie","series"]:[E.kind],mxs=G.genres.reduce(function(m,g){return Math.max(m,g.sort||0)},0);
      var gi=await sb.from("genres").insert(kinds.map(function(kd){return{kind:kd,name:gn,emoji:ge,sort:mxs+1}})).select("id,kind");
      if(gi.error)return toast(/duplicate|unique/i.test(gi.error.message)?"Такой жанр уже есть":"Ошибка: "+gi.error.message);
      G.genres=(await sb.from("genres").select("*").order("sort")).data||[];
      gi.data.forEach(function(g){if(g.kind===E.kind&&E.genre_ids.indexOf(g.id)<0)E.genre_ids.push(g.id)});toast("Жанр добавлен и выбран");return render();
    case"save":return save();
    case"del":if(!confirm("Удалить «"+E.title+"» навсегда вместе с оценками пользователей?"))return;
      var d=await sb.from("titles").delete().eq("id",E.id);if(d.error)return toast("Не удалось удалить");
      await loadAll();G.view="list";toast("Удалено");return render();
    case"addprov":var nm=document.getElementById("pn").value.trim(),f=document.getElementById("pi").files[0];if(!nm)return toast("Введите название");
      var ic=f?await upload(f,"icons"):null;var pr=await sb.from("providers").insert({name:nm,icon_url:ic});if(pr.error)return toast("Ошибка: "+pr.error.message);
      await loadAll();toast("Добавлено");return render();
    case"delprov":if(!confirm("Удалить кинотеатр? Он пропадёт и из всех фильмов."))return;
      var dp=await sb.from("providers").delete().eq("id",Number(a[1]));if(dp.error)return toast("Не удалось удалить");await loadAll();return render();
  }}catch(err){console.error(err);toast("Ошибка: "+(err.message||err))}
});
boot();
</script>
</body>
</html>
