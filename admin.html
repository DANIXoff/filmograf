.prev{max-height:170px;border-radius:8px;margin-top:8px;display:block}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;z-index:9}
.mute{color:var(--mute);font-size:13px}
.viz{--bar:#2a78d6}

.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-bottom:12px}

.chart text{fill:var(--mute);font-size:11px}
.tops{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.tbl{width:100%;border-collapse:collapse;font-size:14px}.tbl td{padding:7px 4px;border-top:1px solid var(--line)}.tbl tr:first-child td{border-top:0}.tbl td.n{text-align:right;font-variant-numeric:tabular-nums;color:var(--mute);white-space:nowrap}

.kv{display:grid;grid-template-columns:160px 1fr;gap:6px 12px;font-size:14px}.kv span{color:var(--mute)}
.badge.ban{background:var(--red);color:#fff}

.nt-red{background:#fde8e7;color:#b42318}.nt-yellow{background:#fff3cf;color:#8a5a00}.nt-blue{background:#e5f0ff;color:#1d5bd8}
.trb{display:inline-block;margin-top:6px;border:0;background:none;color:#2a78d6;font:600 13px inherit;cursor:pointer;padding:2px 0}.trb:disabled{opacity:.6}
